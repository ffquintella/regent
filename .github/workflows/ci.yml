name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare bundled gem cache
        run: python scripts/prepare-gem-cache.py

      - name: Test offline cache preparer
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run tests
        run: cargo test --verbose --locked
      
      - name: Run doctests
        run: cargo test --doc

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy -- -D warnings

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare bundled gem cache
        run: python scripts/prepare-gem-cache.py

      - name: Build release
        run: cargo build --release --verbose
      
      - name: Stage bundled gem cache
        run: python scripts/prepare-gem-cache.py --stage target/release/bundled_gems

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: regent-${{ matrix.os }}
          path: |
            target/release/regent${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            target/release/bundled_gems/

  vscode-extension-version:
    name: VS Code Extension Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VS Code extension version sync
        run: python3 scripts/sync-vscode-version.py --check
