[package]
name = "regent"
version = "0.9.2"
edition = "2021"
authors = ["Felipe Quintella"]
license = "AGPL-3.0"
description = "Regent - A Rust-based alternative development kit for Puppet modules with Artichoke Ruby support"
homepage = "https://github.com/ffquintella/regent"
default-run = "regent"

[dependencies]
# CLI framework
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }

# Data formats
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# Output formatting
colored = "3.1.1"
chrono = "0.4.45"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# File operations
fs_extra = "1.3.0"

# Pattern matching
regex = "1.13.1"
# Look-around/backreference support the `regex` crate intentionally omits;
# used for Puppet `=~` and spec content matchers so patterns with `(?=…)` etc. work.
fancy-regex = "0.19.2"

# Logging
log = "0.4.34"
env_logger = "0.11.11"

# Async utilities
lazy_static = "1.5.1"
sha2 = "0.11.0"
md5 = "0.8.1"
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
zip = "8.6.0"
semver = "1.0.28"
walkdir = "2.5.0"
tempfile = "3.27.0"

# HTTP client for fixture downloads (Forge modules, etc.)
ureq = { version = "3.4.2", features = ["rustls", "json"] }

# Artichoke Ruby integration
artichoke = { git = "https://github.com/artichoke/artichoke.git" }
serde_yaml = "0.9.34"
indexmap = "2.14.2"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "regent"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "regent"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
default = []
