<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3B82F6"/>
  
  <!-- Maestro podium base -->
  <rect x="40" y="85" width="48" height="8" fill="#374151" rx="2"/>
  
  <!-- Conductor's baton (main element) -->
  <g transform="translate(64, 64)">
    <!-- Baton handle -->
    <line x1="-25" y1="15" x2="20" y2="-25" stroke="#F8F9FA" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Baton tip highlight -->
    <circle cx="20" cy="-25" r="4" fill="#FCD34D"/>
    <circle cx="20" cy="-25" r="2" fill="#FFFFFF"/>
    
    <!-- Music staff lines -->
    <line x1="-35" y1="-10" x2="10" y2="-10" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
    <line x1="-35" y1="-5" x2="10" y2="-5" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
    <line x1="-35" y1="0" x2="10" y2="0" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
    <line x1="-35" y1="5" x2="10" y2="5" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
    <line x1="-35" y1="10" x2="10" y2="10" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Musical notes on staff -->
    <circle cx="-25" cy="-10" r="2.5" fill="#1E3A8A"/>
    <line x1="-25" y1="-10" x2="-25" y2="-20" stroke="#1E3A8A" stroke-width="1.5"/>
    
    <circle cx="-10" cy="0" r="2.5" fill="#1E3A8A"/>
    <line x1="-10" y1="0" x2="-10" y2="-10" stroke="#1E3A8A" stroke-width="1.5"/>
    
    <circle cx="5" cy="5" r="2.5" fill="#1E3A8A"/>
    <line x1="5" y1="5" x2="5" y2="-5" stroke="#1E3A8A" stroke-width="1.5"/>
    
    <!-- Letter R in circle (conductor's logo) -->
    <circle cx="-5" cy="-30" r="12" fill="#FCD34D" stroke="#F59E0B" stroke-width="2"/>
    <text x="-5" y="-26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
          fill="#1E3A8A" text-anchor="middle" dominant-baseline="middle">R</text>
  </g>
  
  <!-- Motion lines (conducting gesture) -->
  <path d="M 85 40 Q 90 35, 95 38" stroke="#FCD34D" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 88 45 Q 95 42, 100 46" stroke="#FCD34D" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
