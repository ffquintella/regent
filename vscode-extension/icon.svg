<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3B82F6"/>
  
  <!-- Crown/Regent symbol -->
  <g transform="translate(64, 64)">
    <!-- Crown base -->
    <path d="M -35 10 L -35 15 L 35 15 L 35 10 Z" fill="#FCD34D" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Crown points -->
    <path d="M -35 10 L -30 -15 L -20 0 L -10 -20 L 0 0 L 10 -20 L 20 0 L 30 -15 L 35 10 Z" 
          fill="#FCD34D" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Jewels on crown -->
    <circle cx="-30" cy="-15" r="3" fill="#EF4444"/>
    <circle cx="-10" cy="-20" r="3" fill="#10B981"/>
    <circle cx="10" cy="-20" r="3" fill="#8B5CF6"/>
    <circle cx="30" cy="-15" r="3" fill="#EF4444"/>
    
    <!-- Letter R in center -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
          fill="#1E3A8A" text-anchor="middle" dominant-baseline="middle">R</text>
  </g>
  
  <!-- Puppet strings effect -->
  <line x1="40" y1="20" x2="40" y2="40" stroke="#E5E7EB" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="15" x2="64" y2="40" stroke="#E5E7EB" stroke-width="1" opacity="0.6"/>
  <line x1="88" y1="20" x2="88" y2="40" stroke="#E5E7EB" stroke-width="1" opacity="0.6"/>
</svg>
